<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📸 My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <!-- Category Buttons -->
    <div class="filters">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('animals')">Animals</button>
        <button onclick="filterImages('travel')">Travel</button>
    </div>

    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item nature"
             onclick="openLightbox(0)">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                 alt="Nature">
        </div>

        <div class="gallery-item nature"
             onclick="openLightbox(1)">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b"
                 alt="Mountain">
        </div>

        <div class="gallery-item animals"
             onclick="openLightbox(2)">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d"
                 alt="Lion">
        </div>

        <div class="gallery-item animals"
             onclick="openLightbox(3)">
            <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46"
                 alt="Elephant">
        </div>

        <div class="gallery-item travel"
             onclick="openLightbox(4)">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beach">
        </div>

        <div class="gallery-item travel"
             onclick="openLightbox(5)">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Travel">
        </div>

    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <button class="close" onclick="closeLightbox()">×</button>

        <button class="prev" onclick="previousImage()">❮</button>

        <img id="lightboxImage" src="" alt="Large Image">

        <button class="next" onclick="nextImage()">❯</button>

    </div>

    <footer>
        <p>© 2026 My Image Gallery</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
